name: Unzip project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into repo root
        run: |
          set -e
          Z=$(ls *.zip | head -n1)
          mkdir /tmp/x
          unzip -q "$Z" -d /tmp/x
          D=$(dirname "$(find /tmp/x -name settings.gradle.kts | head -n1)")
          (cd "$D" && tar --exclude=./.github -cf - .) | tar -xf -
          git rm -q "$Z"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract project"
          git push
