<div class="top"><h1>🤖 دستیار کدنویسی</h1><button type="button" id="cfg" aria-label="تنظیم">⚙</button><button type="button" id="new">گفتگوی جدید</button></div>

<div id="cp"><div class="w"><button type="button" class="sq gh" id="attb" aria-label="پیوست فایل" onclick="document.getElementById('att').click()">📎</button><input type="file" id="att" hidden accept="text/*,.kt,.kts,.java,.js,.ts,.py,.html,.css,.json,.xml,.md,.gradle,.yml,.yaml,.sql,.sh,.txt,.log"><textarea id="in" rows="1" placeholder="کد یا سؤالت را بنویس…" dir="auto"></textarea><button type="button" class="sq" id="send" aria-label="ارسال">⬆</button><button type="button" class="sq st" id="stop" aria-label="توقف" hidden>■</button></div></div>
<div id="toast"></div>
<script>
const FS={gandom:'Gandom',labkhand:'Labkhand',gofteh:'Gofteh',vazir:'Vazirmatn',shabnam:'Shabnam',kara:'SGKara',soraya:'ASoraya',titr:'BTitr',ordi:'Ordibehesht',rooz:'ARooznameh',nast:'IranNastaliq'},FN={gandom:'گندم (پیش‌فرض)',labkhand:'لبخند',gofteh:'گفته',vazir:'وزیرمتن',shabnam:'شبنم',kara:'کارا',soraya:'ثریا',titr:'تیتر',ordi:'اردیبهشت',rooz:'روزنامه',nast:'ایران نستعلیق'};
const getF=()=>{try{const f=localStorage.getItem('uf');return FS[f]?f:'gandom'}catch(e){return'gandom'}};
const fstack=()=>FS[getF()]+',Gandom,Vazirmatn,system-ui,Tahoma,sans-serif';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const SYS='You are an expert senior software engineer and coding assistant living inside a mobile app. The user mostly writes Persian (Farsi); answer in Persian unless the user asks for another language, but keep code, identifiers, commands, file names and technical terms in English (left-to-right). '+
'Rules: (1) Be correct above all: find the real root cause before proposing a fix, and never invent APIs, libraries, flags or versions; if unsure, say so. (2) Give complete, runnable code in fenced blocks with a language tag; when editing existing code, show the full changed function/file unless it is huge, and say exactly where it goes. (3) Keep explanations short and scannable for a phone screen: short paragraphs, small lists, no filler. (4) If the request is ambiguous, state your assumption and proceed; ask at most one question and only when truly blocked. (5) Mention edge cases, security and performance problems you notice, briefly. (6) Prefer modern best practices and simple solutions. (7) You cannot run code; never claim you did. Expertise includes Android/Kotlin, Java, JavaScript/TypeScript, HTML/CSS, Python, SQL, Git, build tools and debugging logs/stack traces.';
const KW=new Set('abstract async await break case catch class const continue default defer do else enum export extends final finally fn for from fun func function go if implements import in interface is lambda let match new null nil None object override package private protected public pub return self static struct super switch this throw throws trait true false True False try type typealias undefined use val var void when where while with yield def del elif except not and or pass raise int string bool float double long char byte'.split(' '));
const HASH=/^(py|python|sh|bash|shell|zsh|yaml|yml|rb|ruby|toml|dockerfile|makefile|r|perl|ini|conf|properties)$/i;
const R1=/(\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->|\/\/[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_$][\w$]*\b)(\s*\()?/g;
const R2=/(\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->|#[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_$][\w$]*\b)(\s*\()?/g;
function hl(code,lang){const re=new RegExp((HASH.test(lang||'')?R2:R1).source,'g');let out='',last=0,m;
while((m=re.exec(code))){out+=esc(code.slice(last,m.index));const t=m[0];
if(m[1])out+='<span class="t-c">'+esc(t)+'</span>';
else if(m[2])out+='<span class="t-s">'+esc(t)+'</span>';
else if(m[3])out+='<span class="t-n">'+esc(t)+'</span>';
else if(m[4]){if(KW.has(m[4]))out+='<span class="t-k">'+esc(m[4])+'</span>'+esc(m[5]||'');else if(m[5])out+='<span class="t-f">'+esc(m[4])+'</span>'+esc(m[5]);else out+=esc(t)}
last=re.lastIndex;if(!t.length)re.lastIndex++}
return out+esc(code.slice(last))}
const inl=s=>esc(s).replace(/`([^`\n]+)`/g,'<code class="i">$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
function blocks(t){const L=t.split('\n');let h='',ty=null,buf=[];
const fl=()=>{if(!ty)return;if(ty==='p')h+='<p dir="auto">'+buf.map(inl).join('<br>')+'</p>';else if(ty==='q')h+='<blockquote dir="auto">'+buf.map(inl).join('<br>')+'</blockquote>';else h+='<'+ty+'>'+buf.map(x=>'<li dir="auto">'+inl(x)+'</li>').join('')+'</'+ty+'>';ty=null;buf=[]};
const push=(k,x)=>{if(ty!==k){fl();ty=k}buf.push(x)};
for(const l of L){let m;
if((m=l.match(/^#{1,4}\s+(.*)/))){fl();h+='<h3 dir="auto">'+inl(m[1])+'</h3>'}
else if((m=l.match(/^\s*[-*•]\s+(.*)/)))push('ul',m[1]);
else if((m=l.match(/^\s*\d+[.)]\s+(.*)/)))push('ol',m[1]);
else if((m=l.match(/^>\s?(.*)/)))push('q',m[1]);
else if(!l.trim())fl();
else push('p',l)}
fl();return h}
function md(src){let h='',last=0,m;const re=/```([^\n]*)\n([\s\S]*?)(?:```|$)/g;
while((m=re.exec(src))){h+=blocks(src.slice(last,m.index));const lang=(m[1]||'').trim().split(/\s+/)[0]||'';
h+='<div class="cb"><div class="ch"><span>'+esc(lang||'code')+'</span><button type="button" data-act="cc">کپی</button></div><pre>'+hl(m[2].replace(/\n$/,''),lang)+'</pre></div>';
last=re.lastIndex;if(m[0].length===0)re.lastIndex++;if(last>=src.length)break}
return h+blocks(src.slice(last))}
let M=[],busy=0,cid=0,raf=0,keyMissing=0;
try{M=JSON.parse(localStorage.getItem('ai_chat1')||'[]');if(!Array.isArray(M))M=[]}catch(e){M=[]}
const store=()=>{try{localStorage.setItem('ai_chat1',JSON.stringify(M.slice(-80).map(x=>({r:x.r,t:x.t}))))}catch(e){}};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)};
const CH=[['🐞 رفع خطا','این کد یا خطا را بررسی کن؛ علت اصلی و راه‌حل را بگو و کد درست را بنویس:\n\n'],['⚡ بهینه‌سازی','این کد را تمیز و بهینه کن (بدون تغییر رفتار) و بگو چه چیزی را عوض کردی:\n\n'],['📖 توضیح کد','این کد را قدم‌به‌قدم و ساده توضیح بده:\n\n'],['🧪 نوشتن تست','برای این کد تست واحد بنویس:\n\n'],['🔄 تبدیل زبان','این کد را به زبان ... تبدیل کن:\n\n'],['🏗 ساخت از صفر','می‌خواهم این را بسازم؛ کامل و قابل اجرا بنویس:\n\n']];
function msgHtml(x,i){const last=i===M.length-1;
if(x.r==='u')return '<div class="m u"><div class="b" dir="auto">'+esc(x.t)+'</div></div>';
let b=x.t?md(x.t):(busy&&last?'<span class="dots"><i></i><i></i><i></i></span>':'');
if(x.err)b+='<div class="err">'+esc(x.err)+'</div>';
let a='';if(!(busy&&last))a='<div class="acts">'+(x.t?'<button type="button" data-act="cp">کپی همه</button>':'')+(last?'<button type="button" data-act="rt">🔁 دوباره</button>':'')+'</div>';
return '<div class="m a" data-i="'+i+'"><div class="b">'+b+'</div>'+a+'</div>'}
function renderAll(){const e=$('#msgs');let h='';
if(!M.length){h='<div class="hero"><div class="ic">🤖</div><h2>دستیار کدنویسی</h2><p>کد، خطا یا ایده‌ات را بنویس؛ با 📎 فایل کد هم می‌توانی بفرستی.</p><div class="chips">'+CH.map((c,i)=>'<button type="button" data-ch="'+i+'">'+c[0]+'</button>').join('')+'</div></div>'}
else h=M.map(msgHtml).join('');
if(keyMissing)h+='<div class="card"><p>برای کار کردن دستیار، کلید API لازم است (Claude، Gemini یا OpenAI). همان کلیدی که برای رسید می‌گذارید استفاده می‌شود.</p><button type="button" class="pri" data-act="keys">تنظیم کلید هوش مصنوعی</button></div>';
e.innerHTML='<div class="w">'+h+'</div>';e.scrollTop=e.scrollHeight}
function updLast(){const i=M.length-1,e=$('#msgs'),near=e.scrollHeight-e.scrollTop-e.clientHeight<140;const el=e.querySelector('.m.a[data-i="'+i+'"] .b');if(!el){renderAll();return}
el.innerHTML=M[i].t?md(M[i].t):'<span class="dots"><i></i><i></i><i></i></span>';if(near)e.scrollTop=e.scrollHeight}
function setBusy(v){busy=v;$('#send').hidden=!!v;$('#stop').hidden=!v}
function payload(){let a=M.filter(x=>x.t&&!x.err);while(a.length&&a[0].r!=='u')a.shift();a=a.slice(-30);let n=0,o=[];for(let i=a.length-1;i>=0;i--){n+=a[i].t.length;if(n>80000&&o.length)break;o.unshift({role:a[i].r==='u'?'user':'assistant',content:a[i].t})}
while(o.length&&o[0].role!=='user')o.shift();return o}
function run(){if(busy)return;if(!(window.Android&&window.Android.aiChat)){M.push({r:'a',t:'',err:'دستیار فقط در برنامهٔ اندروید کار می‌کند.'});renderAll();return}
keyMissing=0;M.push({r:'a',t:''});cid++;setBusy(1);renderAll();
try{window.Android.aiChat(JSON.stringify({id:cid,system:SYS,messages:payload()}))}catch(e){window.__aiEnd(cid,false,'ارسال ممکن نشد')}}
window.__aiChunk=(id,t)=>{if(id!==cid||!busy)return;const m=M[M.length-1];m.t+=t;if(!raf)raf=requestAnimationFrame(()=>{raf=0;updLast()})};
window.__aiEnd=(id,ok,msg)=>{if(id!==cid||!busy)return;setBusy(0);const m=M[M.length-1];
if(!ok){if(msg==='nokey'){keyMissing=1;if(!m.t)M.pop()}else m.err=msg||'خطا در ارتباط'}
else if(!m.t)m.err='پاسخی دریافت نشد';
store();renderAll()};
function send(){if(busy)return;const i=$('#in'),t=i.value.trim();if(!t)return;M.push({r:'u',t});i.value='';grow();store();run()}
function grow(){const i=$('#in');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,150)+'px'}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('کپی شد'),()=>fb(t))}catch(e){fb(t)}}
function fb(t){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('کپی شد')}catch(e){toast('کپی نشد')}a.remove()}
$('#msgs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.ch!==undefined){const i=$('#in');i.value=CH[+b.dataset.ch][1];grow();i.focus();i.setSelectionRange(i.value.length,i.value.length);return}
const a=b.dataset.act;if(a==='cc'){copy(b.closest('.cb').querySelector('pre').textContent)}

const r=new FileReader();r.onload=()=>{const ext=(f.name.split('.').pop()||'').toLowerCase(),i=$('#in');i.value+=(i.value&&!i.value.endsWith('\n')?'\n':'')+f.name+':\n```'+ext+'\n'+String(r.result).replace(/\n$/,'')+'\n```\n';grow();i.focus()};r.onerror=()=>toast('خواندن فایل ممکن نشد');r.readAsText(f)});
